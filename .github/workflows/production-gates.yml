name: CRYPTIC production gate contracts

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  production-gate-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements-attestation.txt -r requirements-pq.txt jsonschema
      - name: Verify production runtime composition and fail-closed contracts
        run: python -m unittest discover -s tests -p "test_gate_contracts.py" -v
      - name: Verify remote trust, anchor, and key-custody contracts
        run: python -m unittest discover -s tests -p "test_remote_providers.py" -v
      - name: Verify ADAM crash recovery
        run: python -m unittest discover -s tests -p "test_adam_crash_recovery.py" -v
      - name: Verify mutual-TLS peer interoperability
        run: python -m unittest discover -s tests -p "test_gcf_independent_network.py" -v
      - name: Verify authenticated HCCGN target policy
        run: python -m unittest discover -s tests -p "test_hccgn_registry.py" -v
      - name: Verify GCF round-change proof primitives (no lock mutation)
        run: python -m unittest discover -s tests -p "test_round_change.py" -v
      - name: Set up Node.js for Cloudflare Worker contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare sequence-anchor Worker contracts
        run: node --experimental-default-type=module --test tests/cloudflare_sequence_anchor.test.mjs
