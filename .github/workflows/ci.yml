name: CRYPTIC CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-attestation.txt -r requirements-pq.txt jsonschema
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  supervised-http-platform:
    name: supervised-http (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport test dependencies
        run: python -m pip install -r requirements-attestation.txt -r requirements-pq.txt
      - name: Verify supervised spawn worker
        run: python -m unittest discover -s tests -p "test_supervised_http.py" -v
