name: Crystalline schema validation

on:
  pull_request:
    paths:
      - "schemas/crystalline/v1/**"
      - "tests/unit/test_crystalline_schemas.py"
      - ".github/workflows/crystalline-schema-check.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/crystalline/v1/**"
      - "tests/unit/test_crystalline_schemas.py"
      - ".github/workflows/crystalline-schema-check.yml"

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate schemas and run unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile scripts/cryptic-seed-ledger.py tests/unit/test_seed_ledger.py tests/unit/test_crystalline_schemas.py
