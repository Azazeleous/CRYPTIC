name: mining-engine-tests

on:
  push:
    branches:
      - feat/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bounded benchmark
        run: python scripts/benchmark_sha256d.py --attempts 1000000 --workers 2 --chunk-size 50000
