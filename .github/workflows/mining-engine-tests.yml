name: mining-engine-tests

on:
  push:
    branches:
      - feat/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional attestation and test dependencies
        run: python -m pip install -r requirements-attestation.txt -r requirements-pq.txt -r requirements-test.txt jsonschema
      - name: Compile all Python source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run independent Go HCCGN conformance vectors
        run: cd conformance/go && go test ./...
      - name: Run HCCGN midstate kernel benchmark and reference check
        run: python scripts/benchmark_hccgn_work.py --attempts 100000 --start-nonce 0
      - name: Run bounded benchmark
        run: python scripts/benchmark_sha256d.py --attempts 1000000 --workers 2 --chunk-size 50000
